<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Stars Draft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="topUI">
    <p>105 brawlers (latest: Nori) <small>by param</small></p>

    <div class="autocomplete-box">
        <div id="chips" class="chips"></div>
        <input id="input" placeholder="Brawler Name"
               oninput="showSuggestions()"
               onkeydown="handleKeyDown(event)">
        <div id="suggestions" class="suggestions"></div>
        <div id="inputError" class="input-error"></div>
    </div>
</div>
<div id="shared" class="shared-box" style="display:none;"></div>
<div id="result" class="result"></div>
<script src="data.js"></script>
<script src="tier-list.js"></script>
<script src="script.js"></script>
</body>
</html>
