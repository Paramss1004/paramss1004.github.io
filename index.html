<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Stars Draft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="topUI">
    <div class="autocomplete-box">
		<div id="chips" class="chips"></div>
		<div class="input-wrap">
			<input id="input" placeholder="Search Brawlers" autofocus
				   oninput="showSuggestions()"
				   onkeydown="handleKeyDown(event)">
			<button id="enterBtn" class="enter-btn" onclick="findCounters()" aria-label="Search">↵</button>
		</div>
		<div id="suggestions" class="suggestions"></div>
		<div id="inputError" class="input-error"></div>
		<div id="teamSizeNote" class="team-size-note" style="display:none;"></div>
	</div>

	<div class="section-divider"><span class="section-label">📚 Database — Search a Brawler's Strengths</span></div>
	<div class="autocomplete-box">
		<div class="input-wrap">
			<input id="strengthInput" placeholder="Who does this brawler counter?"
				   oninput="showStrengthSuggestions()"
				   onkeydown="handleStrengthKeyDown(event)">
			<button class="enter-btn" onclick="searchStrengthsFromInput()" aria-label="Search">↵</button>
		</div>
		<div id="strengthSuggestions" class="suggestions"></div>
		<div id="strengthInputError" class="input-error"></div>
	</div>

	<div class="browse-bar">
		<div class="browse-classes">
			<span class="browse-chip class-chip" onclick="browseClass('thrower')">💥 Throwers</span>
			<span class="browse-chip class-chip" onclick="browseClass('tank')">🛡️ Tanks</span>
			<span class="browse-chip class-chip" onclick="browseClass('assassin')">⚡ Assassins</span>
			<span class="browse-chip class-chip" onclick="browseClass('antitank')">⚔️ Antitanks</span>
			<span class="browse-chip class-chip" onclick="browseClass('sniper')">🎯 Snipers</span>
			<span class="browse-chip class-chip" onclick="browseClass('control')">🌀 Controllers</span>
		</div>
	</div>

	<div class="section-divider"><span class="section-label">🏆 Tier List</span></div>
	<button id="tierListToggleBtn" class="tier-toggle-btn" onclick="toggleTierList()">Show Tier List</button>
	<div id="tierListDisplay" class="tier-list-display" style="display:none;"></div>
</div>
<div id="sortControls" class="sort-controls" style="display:none;">
    <button id="suggestTeamBtn" onclick="suggestTeam()">Suggest Full Team</button>
    <button id="sortToggleBtn" onclick="toggleSortMode()">Sort by Class 🔰</button>
</div>
<div id="classCounters" class="shared-box" style="display:none;"></div>
<div id="teamSuggestion" class="shared-box" style="display:none;"></div>
<div id="shared" class="shared-box" style="display:none;"></div>
<div id="result" class="result"></div>
<button id="backBtn" class="back-btn" onclick="resetSearch()" style="display:none;">←-- Back</button>
<script src="class-groups.js"></script>
<script src="script.js"></script>
<script src="owned-brawlers.js"></script>
<script src="brawler-main.js"></script>
<script src="brawler-info.js"></script>
<script src="brawler-img.js"></script>
<script src="data.js"></script>
<script src="tier-list.js"></script>
<div id="infoModal" class="info-modal" onclick="if(event.target===this) closeInfoModal()">
    <div class="info-modal-box">
        <button class="info-modal-close" onclick="closeInfoModal()">&times;</button>
        <p id="infoModalText"></p>
    </div>
</div>
</body>
</html>
